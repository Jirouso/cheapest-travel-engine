  routes.forEach((route, index) => {

    html += `
      <div class="route ${index === 0 ? "cheap" : ""}">

        ${index === 0 ? "🏆 最安候補" : ""}

        <h3>${route.type}</h3>

        <p>${from} → ${to}</p>

        <p>
          💰 <span class="price">
          ¥${route.price.toLocaleString()}
          </span>
        </p>

        <p>⏱ ${route.time}</p>

      </div>
    `;

  });

  result.innerHTML = html;

}
