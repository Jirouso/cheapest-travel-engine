
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheapest Travel Engine</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7fb;
      color: #222;
    }
    h1 { color: #155eef; }
    .panel {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0001;
    }
    label { display: block; margin-top: 16px; }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      font-size: 16px;
    }
    button {
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #155eef;
      color: white;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      padding: 14px;
      background: #eef5ff;
      border-radius: 8px;
      line-height: 1.8;
    }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🌍 Cheapest Travel Engine</h1>
  <p>世界の移動ルートから最安候補を探そう。</p>

  <div class="panel">
    <label for="from">出発地</label>
    <input id="from" list="cities" placeholder="例：Tokyo" autocomplete="off">

    <label for="to">目的地</label>
    <input id="to" list="cities" placeholder="例：Paris" autocomplete="off">

    <datalist id="cities">
      <option value="Tokyo">
      <option value="Osaka">
      <option value="Seoul">
      <option value="Beijing">
      <option value="Shanghai">
      <option value="Bangkok">
      <option value="Singapore">
      <option value="Kuala Lumpur">
      <option value="Delhi">
      <option value="Cairo">
      <option value="Nairobi">
      <option value="Cape Town">
      <option value="Istanbul">
      <option value="Paris">
      <option value="London">
      <option value="Rome">
      <option value="Madrid">
      <option value="New York">
      <option value="Los Angeles">
      <option value="São Paulo">
      <option value="Sydney">
      <option value="Auckland">
    </datalist>

    <label for="transport">移動手段</label>
    <select id="transport">
      <option value="all">すべて比較</option>
      <option value="bus">バス</option>
      <option value="flight">飛行機</option>
      <option value="train">鉄道</option>
    </select>

    <button onclick="searchRoute()">最安候補を検索</button>

    <div id="result">出発地と目的地を入力してね。</div>
    <p class="note">
      ※表示される料金は動作確認用の仮価格です。実際の運賃ではありません。
    </p>
  </div>

  <script>
    function searchRoute() {
      const from = document.getElementById("from").value.trim();
      const to = document.getElementById("to").value.trim();
      const transport = document.getElementById("transport").value;
      const result = document.getElementById("result");

      if (!from || !to) {
        result.textContent = "出発地と目的地を入力してください。";
        return;
      }

      if (from.toLowerCase() === to.toLowerCase()) {
        result.textContent = "出発地と目的地を別の都市にしてください。";
        return;
      }

      const routes = [
        { type: "バス", key: "bus", price: 3000 },
        { type: "飛行機", key: "flight", price: 5000 },
        { type: "鉄道", key: "train", price: 6000 }
      ];

      const filtered = routes
        .filter(route => transport === "all" || route.key === transport)
        .sort((a, b) => a.price - b.price);

      result.innerHTML =
        "<strong>" + from + " → " + to + "</strong><br>" +
        filtered.map((route, index) =>
          (index === 0 ? "🏆 " : "") + route.type +
          "：仮価格 ¥" + route.price.toLocaleString("ja-JP")
        ).join("<br>") +
        "<br><br>最安候補：" + filtered[0].type;
    }
  </script>
</body>
</html>
