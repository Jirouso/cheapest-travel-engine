<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cheapest Travel Engine</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    #result {
      margin-top: 25px;
    }

    .route {
      background: #f1f3f5;
      padding: 15px;
      margin-top: 12px;
      border-radius: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      color: #e63946;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌍 Cheapest Travel Engine</h1>

    <div class="subtitle">
      世界の最安旅行ルートを探そう
    </div>

    <label>出発地</label>
    <input type="text" id="from" placeholder="例：Tokyo">

    <label>目的地</label>
    <input type="text" id="to" placeholder="例：Paris">

    <label>移動方法</label>
    <select id="transport">
      <option value="all">すべて</option>
      <option value="flight">飛行機</option>
      <option value="bus">バス</option>
      <option value="train">鉄道</option>
    </select>

    <button onclick="searchRoute()">
      🔎 最安ルートを検索
    </button>

    <div id="result"></div>

  </div>

  <script>

    function searchRoute() {

      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const transport = document.getElementById("transport").value;

      const result = document.getElementById("result");

      if (from === "" || to === "") {
        result.innerHTML = `
          <div class="route">
            出発地と目的地を入力してください。
          </div>
        `;
        return;
      }

      result.innerHTML = `
        <h2>検索結果</h2>

        <div class="route">
          ✈️ ${from} → ${to}
          <br><br>
          移動方法：${getTransportName(transport)}
          <br><br>
          <span class="price">最安候補を検索中...</span>
        </div>

        <div class="route">
          💡 このサイトでは今後、
          <br>
          飛行機・バス・鉄道を組み合わせて
          <br>
          世界で最も安いルートを探せるようにします。
        </div>
      `;

    }

    function getTransportName(transport) {

      if (transport === "flight") {
        return "飛行機";
      }

      if (transport === "bus") {
        return "バス";
      }

      if (transport === "train") {
        return "鉄道";
      }

      return "すべて";
    }

  </script>

</body>
</html>
